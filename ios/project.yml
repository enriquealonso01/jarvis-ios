name: JarvisApp
options:
  bundleIdPrefix: com.enriquecodes
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 130.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "20"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""            # Enrique sets his team in Xcode (BUILD.md)
    PRODUCT_BUNDLE_IDENTIFIER: com.enriquecodes.jarvis
targets:
  JarvisApp:
    type: application
    platform: iOS
    sources:
      - JarvisApp
    dependencies:
      - package: WebRTC
    info:
      path: JarvisApp/Info.plist
      properties:
        CFBundleDisplayName: JARVIS
        # Backlog #9: real launch screen (branded, no flash of white).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchReactor
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSFaceIDUsageDescription: "Unlock JARVIS secrets."
        NSMicrophoneUsageDescription: "JARVIS needs the microphone for voice calls."
        # ITMS-90683 fix (2026-09-18): WebRTC links camera symbols even though the
        # app only makes audio calls — the ASC scanner requires the key anyway.
        NSCameraUsageDescription: "JARVIS can use the camera for video calls and scanning your setup. Audio-only calls work without camera access."
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
          - voip
    settings:
      base:
        PRODUCT_NAME: JarvisApp
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Push Notifications entitlement (aps-environment) — REQUIRED for the VoIP
        # push path: without it the signed profile carries no push capability and
        # APNs rejects every push (calls never ring even with the .p8 installed).
        CODE_SIGN_ENTITLEMENTS: JarvisApp/JarvisApp.entitlements
