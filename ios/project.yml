name: JarvisApp
options:
  bundleIdPrefix: com.enriquecodes
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 130.0.0
  # v2 local packages (V2-PLAN §5.1). Referenced by JarvisApp so xcodegen
  # resolves them; extensions will reference only JarvisKit/Persistence/
  # DesignSystem/JarvisIntents (plan §5.1 rules) once they exist in v2.
  JarvisKit:
    path: ../Packages/JarvisKit
  Persistence:
    path: ../Packages/Persistence
  DesignSystem:
    path: ../Packages/DesignSystem
  FeaturesChat:
    path: ../Packages/FeaturesChat
  FeaturesVoice:
    path: ../Packages/FeaturesVoice
  FeaturesRuns:
    path: ../Packages/FeaturesRuns
  FeaturesCapture:
    path: ../Packages/FeaturesCapture
  CallKitPackage:
    path: ../Packages/CallKit
  JarvisIntents:
    path: ../Packages/JarvisIntents
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0.0"
    # Local-fallback only — CI stamps the real build number from the GitHub
    # run number via xcargs (Fastfile); a literal here never reaches TestFlight
    # because the plist references $(CURRENT_PROJECT_VERSION), not a value.
    CURRENT_PROJECT_VERSION: "0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""            # Enrique sets his team in Xcode (BUILD.md)
    PRODUCT_BUNDLE_IDENTIFIER: com.enriquecodes.jarvis
targets:
  JarvisApp:
    type: application
    platform: iOS
    sources:
      - JarvisApp
    dependencies:
      - package: WebRTC
      # v2 local packages (Item 0 skeleton) — compiled + linked into the app
      # so CI catches breakage early. Feature wiring happens in M1+ items.
      - package: JarvisKit
      - package: Persistence
      - package: DesignSystem
      - package: FeaturesChat
      - package: FeaturesVoice
      - package: FeaturesRuns
      - package: FeaturesCapture
      - package: CallKitPackage
      - package: JarvisIntents
      # Embed the widget extension into the app bundle (PlugIns/). Without
      # this dependency the extension target never rides the archive.
      - target: JarvisWidgets
    info:
      path: JarvisApp/Info.plist
      properties:
        CFBundleDisplayName: JARVIS
        # Deep links from the home-screen widgets (jarvis://sessions etc.)
        # land here — without a registered scheme widget taps do nothing.
        CFBundleURLTypes:
          - CFBundleURLName: com.enriquecodes.jarvis
            CFBundleURLSchemes:
              - jarvis
        # Build/version numbers MUST be variable references: xcodegen's hardcoded
        # defaults write LITERALS (CFBundleVersion=1) into the generated plist,
        # and a literal IGNORES CURRENT_PROJECT_VERSION at archive time — every
        # archive then carries build 1 no matter what xcargs stamp (the
        # -19232 duplicate rejection chain of 2026-09-19). With $(...) refs the
        # build setting (incl. the Fastfile's GITHUB_RUN_NUMBER override) wins.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Backlog #9: real launch screen (branded, no flash of white).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchReactor
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSFaceIDUsageDescription: "Unlock JARVIS secrets."
        NSMicrophoneUsageDescription: "JARVIS needs the microphone for voice calls."
        # ITMS-90683 fix (2026-09-18): WebRTC links camera symbols even though the
        # app only makes audio calls — the ASC scanner requires the key anyway.
        NSCameraUsageDescription: "JARVIS can use the camera for video calls and scanning your setup. Audio-only calls work without camera access."
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
          - voip
    settings:
      base:
        PRODUCT_NAME: JarvisApp
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Push Notifications entitlement (aps-environment) — REQUIRED for the VoIP
        # push path: without it the signed profile carries no push capability and
        # APNs rejects every push (calls never ring even with the .p8 installed).
        CODE_SIGN_ENTITLEMENTS: JarvisApp/JarvisApp.entitlements
  # Home-screen WidgetKit extension (status / metrics / attention widgets).
  # Data path: SHARED KEYCHAIN — keychain-access-groups on both targets
  # (com.enriquecodes.*.widgetshared, same team prefix). No app group: the
  # APP_GROUPS portal attach is web-UI-only (ASC v1 API has no appGroups
  # resource; produce cannot log in with an API key — see Fastfile).
  JarvisWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: JARVIS Widgets
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enriquecodes.jarvis.Widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Widgets/JarvisWidgets.entitlements
  # Unit tests for the call path (audio-session contract + speaker
  # routing). Runs headless on CI (xcodebuild test, iOS Simulator) as part
  # of the pre-deploy gate — no human device testing required for these.
  JarvisAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - JarvisAppTests
    dependencies:
      - target: JarvisApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enriquecodes.jarvis.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  JarvisApp:
    build:
      targets:
        JarvisApp: all
        JarvisAppTests: [test]
    test:
      targets:
        - JarvisAppTests
