name: JarvisApp
options:
  bundleIdPrefix: com.enriquecodes
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 130.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    # Local-fallback only — CI stamps the real build number from the GitHub
    # run number via xcargs (Fastfile); a literal here never reaches TestFlight
    # because the plist references $(CURRENT_PROJECT_VERSION), not a value.
    CURRENT_PROJECT_VERSION: "0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""            # Enrique sets his team in Xcode (BUILD.md)
    PRODUCT_BUNDLE_IDENTIFIER: com.enriquecodes.jarvis
targets:
  JarvisApp:
    type: application
    platform: iOS
    sources:
      - JarvisApp
    dependencies:
      - package: WebRTC
      # Widget extension: built + embedded into the app's PlugIns automatically.
      - target: JarvisWidgets
    info:
      path: JarvisApp/Info.plist
      properties:
        CFBundleDisplayName: JARVIS
        # Deep links from the home-screen widgets (jarvis://sessions etc.)
        # land here — without a registered scheme widget taps do nothing.
        CFBundleURLTypes:
          - CFBundleURLName: com.enriquecodes.jarvis
            CFBundleURLSchemes:
              - jarvis
        # Build/version numbers MUST be variable references: xcodegen's hardcoded
        # defaults write LITERALS (CFBundleVersion=1) into the generated plist,
        # and a literal IGNORES CURRENT_PROJECT_VERSION at archive time — every
        # archive then carries build 1 no matter what xcargs stamp (the
        # -19232 duplicate rejection chain of 2026-09-19). With $(...) refs the
        # build setting (incl. the Fastfile's GITHUB_RUN_NUMBER override) wins.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Backlog #9: real launch screen (branded, no flash of white).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchReactor
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSFaceIDUsageDescription: "Unlock JARVIS secrets."
        NSMicrophoneUsageDescription: "JARVIS needs the microphone for voice calls."
        # ITMS-90683 fix (2026-09-18): WebRTC links camera symbols even though the
        # app only makes audio calls — the ASC scanner requires the key anyway.
        NSCameraUsageDescription: "JARVIS can use the camera for video calls and scanning your setup. Audio-only calls work without camera access."
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
          - voip
    settings:
      base:
        PRODUCT_NAME: JarvisApp
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Push Notifications entitlement (aps-environment) — REQUIRED for the VoIP
        # push path: without it the signed profile carries no push capability and
        # APNs rejects every push (calls never ring even with the .p8 installed).
        CODE_SIGN_ENTITLEMENTS: JarvisApp/JarvisApp.entitlements
  # Home-screen WidgetKit extension (status / metrics / attention widgets).
  # App group entitlement mirrors the app's — the group itself is registered
  # and attached to BOTH bundle IDs by `produce` in the Fastfile's
  # ensure_widget_portal lane (ASC v1 API cannot manage app groups).
  JarvisWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: JARVIS Widgets
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enriquecodes.jarvis.Widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Widgets/JarvisWidgets.entitlements
        # App Group: capability APP_GROUPS was enabled on BOTH bundle IDs via
        # the ASC API (POST /v1/bundleIdCapabilities, 2026-09-21 — the enum is
        # APP_GROUPS, not GROUP_CONTAINER); the group itself + its attach to
        # both IDs happen in the Fastfile's ensure_widget_portal lane, because
        # /v1/appGroups does not exist in ASC v1 (404, verified).
