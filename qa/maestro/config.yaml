# JARVIS v3 journeys against scripts/local-hermes (pinned SHA, stub model).
# flowsOrder matches each flow's name: (no colons, quotes or parens in names).
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - 01 first launch shows the JARVIS sign-in and signs in
    - 02 settings shows the JARVIS server and the Hermex credit
    - 03 new session send approve and reply
    - 04 projects and the workspace menu
    - 05 calls screen and the voice conversation screen
    - 06 voice note pause continue and delete
    - 07 command center tab
    - 08 files from jarvis
    - 09 voice note keyboard open
    - 10 aura states on the voice screen
    - 11 plan strip stays pinned between turns
