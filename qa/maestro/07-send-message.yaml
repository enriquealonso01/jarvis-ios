appId: com.enriquecodes.jarvis
# CI runs with the DEBUG demo token (no real credential in a public repo), so
# the live server correctly answers 401 here. This journey proves the UI half:
# the message sends, the bubble appears, and the app stays responsive. The real
# reply path is verified server-side (jarvis-v2-chat E2E, 11/11).
name: "07 new chat send a message bubble appears app stays responsive"
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "chat.menuButton"
    timeout: 30000
    optional: true
- runFlow: common/close-sidebar.yaml
- extendedWaitUntil:
    visible:
      id: "chat.menuButton"
    timeout: 30000
- tapOn:
    id: "chat.menuButton"
- tapOn:
    id: "sidebar.newChat"
- extendedWaitUntil:
    visible:
      id: "composer.textField"
    timeout: 10000
- tapOn:
    id: "composer.textField"
- inputText: "Automated QA ping: what is two plus two? Answer with digits only."
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Automated QA ping.*"
    timeout: 10000
- takeScreenshot: 07-sent
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 07-after-wait
# Still responsive after the round trip: composer usable, sidebar opens.
- assertVisible:
    id: "composer.textField"
- tapOn:
    id: "chat.menuButton"
- assertVisible:
    id: "sidebar.newChat"
