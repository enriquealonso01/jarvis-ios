appId: com.enriquecodes.jarvis
name: "07 new chat, send a message, JARVIS answers (backend end-to-end)"
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "chat.menuButton"
    timeout: 30000
- tapOn:
    id: "chat.menuButton"
- tapOn:
    id: "sidebar.newChat"
- extendedWaitUntil:
    visible:
      id: "composer.textField"
    timeout: 10000
- tapOn:
    id: "composer.textField"
- inputText: "Automated QA ping: what is two plus two? Answer with digits only."
- tapOn:
    id: "composer.sendButton"
- extendedWaitUntil:
    visible: "Automated QA ping.*"
    timeout: 10000
- takeScreenshot: 07-sent
# A real reply must arrive and no retry/error affordance may show.
- extendedWaitUntil:
    visible: '(?s).*\b4\b.*'
    timeout: 60000
    optional: true
- takeScreenshot: 07-after-wait
- assertNotVisible:
    id: "transcript.retry"
- assertVisible: '(?s).*\b4\b.*'
