appId: com.enriquecodes.jarvis
# Sidebar search is a real destination: titles filter live, and message
# CONTENT is searched too (FTS) - "gondola" only appears in older Breck
# messages, never in a title or the latest-message preview.
name: "08 sidebar search finds chats by title and by message content"
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "chat.menuButton"
    timeout: 30000
    optional: true
- runFlow: common/close-sidebar.yaml
- tapOn:
    id: "chat.menuButton"
- extendedWaitUntil:
    visible:
      id: "sidebar.search"
    timeout: 10000
- tapOn:
    id: "sidebar.search"
- inputText: "Pedal"
- extendedWaitUntil:
    visible: "Pedal trainer.*"
    timeout: 10000
# (by id: the dimmed header behind the drawer may show the open chat's title)
- assertNotVisible:
    id: "sidebar.searchResult.D3EA0000-0000-0000-0000-000000000001"
- takeScreenshot: 08-search-title
- tapOn:
    id: "sidebar.searchClear"
- tapOn:
    id: "sidebar.search"
- inputText: "gondola"
- extendedWaitUntil:
    visible: "IN MESSAGES"
    timeout: 10000
- assertVisible: "Breck day 3 — trip planning"
- takeScreenshot: 08-search-content
- tapOn: "Breck day 3 — trip planning"
- extendedWaitUntil:
    notVisible:
      id: "sidebar.newChat"
    timeout: 10000
- scrollUntilVisible:
    element: "Plan day 3 at Breck.*"
    direction: UP
    timeout: 20000
- takeScreenshot: 08-search-opened
