appId: com.enriquecodes.jarvis
# WhatsApp-style voice notes (requirement 12). The CI simulator has no microphone, so the QA
# lane turns on the Debug-only fake microphone (JarvisFakeMicrophone); sending and the
# transcript are checked on the phone. Covers: a tap leaves the note recording, locked; Pause;
# Resume into the same note; Delete; hold and swipe up locks; hold and slide left cancels.
name: 06 voice note pause continue and delete
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: Settings
    timeout: 30000
# New Session stays disabled while the list still shows cached rows after launch (run
# 39642580261 tapped it then), so try again until the chat opens.
- retry:
    maxRetries: 3
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn: New Session
      # Once a project lane names a folder, New Session asks where; General is the default.
      - tapOn:
          text: General
          optional: true
      - extendedWaitUntil:
          visible: Ask anything.*
          timeout: 10000
# The new chat focuses the text field; with the keyboard up Maestro reads the mic's old
# frame and taps the keyboard instead (run 39656104871), so put the keyboard away first.
# (hideKeyboard can't dismiss this text view, run 39660097889; a tap on the empty transcript does.)
- tapOn:
    text: Send a message to start the conversation.*
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
# A quick tap: the note starts and stays recording, locked (Pause, Delete, Send).
- tapOn:
    text: Voice input
- tapOn:
    text: Allow
    optional: true
- extendedWaitUntil:
    visible: Delete voice note
    timeout: 15000
- assertVisible: Pause
- takeScreenshot: 06-locked
- tapOn: Pause
- extendedWaitUntil:
    visible: Resume
    timeout: 5000
- assertVisible: Paused
- takeScreenshot: 06-paused
- tapOn: Resume
- extendedWaitUntil:
    visible: Pause
    timeout: 5000
- takeScreenshot: 06-resumed
- tapOn: Delete voice note
- extendedWaitUntil:
    notVisible: Delete voice note
    timeout: 5000
- takeScreenshot: 06-deleted
# Press, hold and swipe up: locked, so lifting the finger doesn't send.
- swipe:
    from:
      text: Voice input
    direction: UP
    duration: 1500
- extendedWaitUntil:
    visible: Delete voice note
    timeout: 10000
- assertVisible: Pause
- takeScreenshot: 06-swipe-up-locked
- tapOn: Delete voice note
- extendedWaitUntil:
    notVisible: Delete voice note
    timeout: 5000
# Press, hold and slide left: cancelled, nothing left behind.
- swipe:
    from:
      text: Voice input
    direction: LEFT
    duration: 1500
- assertNotVisible: Delete voice note
- assertNotVisible: Automated QA ping
- takeScreenshot: 06-slide-left-cancelled
