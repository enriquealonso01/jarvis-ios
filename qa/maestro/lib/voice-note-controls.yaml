appId: com.enriquecodes.jarvis
# The recording bar's controls, pressed by REAL coordinates (percent of the screen) on the
# visible controls, not by accessibility id: hit-testing is what failed on Enrique's phone
# (build 83: the old input bar sat on top of the recording bar). Called by flows 06 (keyboard
# closed) and 09 (keyboard open) with PREFIX for the screenshot names. Starts on a chat whose
# input bar is empty (camera + mic).
#   Delete 12.4%, Pause 74.6%, Send 87.6% of the width, 92.5% of the height (bottom bar).
---
- assertVisible: Camera
# 1. A quick tap: the note starts and stays recording, locked. The text bar is GONE: no camera,
#    no field, no placeholder (one container swap, not hidden under the recording bar).
- tapOn:
    text: Voice input
- tapOn:
    text: Allow
    optional: true
- extendedWaitUntil:
    visible: Delete voice note
    timeout: 15000
- assertNotVisible: Camera
- assertNotVisible: Ask anything.*
- assertVisible: Pause
- takeScreenshot: ${PREFIX}-locked
# 2. Pause by a coordinate tap: Resume appears.
- tapOn:
    point: 74.6%,92.5%
- extendedWaitUntil:
    visible: Resume
    timeout: 8000
- assertVisible: Paused
- takeScreenshot: ${PREFIX}-paused
# 3. Resume: Pause is back.
- tapOn:
    text: Resume
- extendedWaitUntil:
    visible: Pause
    timeout: 8000
- takeScreenshot: ${PREFIX}-resumed
# 4. Delete by a coordinate tap: the normal bar returns.
- tapOn:
    point: 12.4%,92.5%
- extendedWaitUntil:
    visible: Camera
    timeout: 8000
- assertNotVisible: Delete voice note
- assertVisible: Ask anything.*
- takeScreenshot: ${PREFIX}-deleted
# 5. Press, hold and swipe up: locked, so lifting the finger doesn't send.
- swipe:
    from:
      text: Voice input
    direction: UP
    duration: 1500
- extendedWaitUntil:
    visible: Delete voice note
    timeout: 10000
- assertVisible: Pause
- takeScreenshot: ${PREFIX}-swipe-up-locked
- tapOn:
    point: 12.4%,92.5%
- extendedWaitUntil:
    visible: Camera
    timeout: 8000
# 6. Record again and Send by a coordinate tap: the audio bubble is in the chat at once.
- tapOn:
    text: Voice input
- extendedWaitUntil:
    visible: 0:02
    timeout: 15000
- tapOn:
    point: 87.6%,92.5%
- extendedWaitUntil:
    visible: Waiting to send…|Transcript
    timeout: 15000
- takeScreenshot: ${PREFIX}-sent
# 7. The transcript arrives afterwards; the Transcript button opens it.
- extendedWaitUntil:
    visible: Transcript
    timeout: 30000
- tapOn:
    text: Transcript
- assertVisible: Fake transcript for QA.
- takeScreenshot: ${PREFIX}-transcript
