appId: com.enriquecodes.jarvis
name: "04 composer type plus-menu model chooser"
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "chat.menuButton"
    timeout: 30000
    optional: true
- runFlow: common/close-sidebar.yaml
- extendedWaitUntil:
    visible:
      id: "composer.textField"
    timeout: 30000
- tapOn:
    id: "composer.textField"
- inputText: "draft that I will not send"
- takeScreenshot: 04-composer-typing
- assertVisible: "Send"
# Put the keyboard away the way a user does: drag the conversation down.
- swipe:
    start: "50%,30%"
    end: "50%,60%"
- waitForAnimationToEnd
- takeScreenshot: 04-keyboard-dismissed
- tapOn:
    id: "composer.plusButton"
- waitForAnimationToEnd
- takeScreenshot: 04-plus-sheet
- swipe:
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: 04-after-dismiss
