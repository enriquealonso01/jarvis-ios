appId: com.enriquecodes.jarvis
# The plan strip between turns. scripts/local-hermes's stub model answers a prompt that mentions
# a plan by writing a three-step plan with todo_list and stopping with two steps open, so the
# strip (HermesPlanStrip) stays pinned above the composer once the turn has ended; "finish"
# completes every step, so the strip goes and the plan settles at the top of that turn as the
# Plan row. Camera is back only once the composer is idle (no Stop). The strip is matched by its
# label, "Plan, 1 of 3, <step>": inside the chat its own identifier reads as the chat container's
# (run 40944008943). Once every step is done the strip and the row would both read "Plan, 3 of 3",
# so the settled state is one such label, not two.
name: 11 plan strip stays pinned between turns
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: Settings
    timeout: 30000
- retry:
    maxRetries: 3
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn: New Session
      - tapOn:
          text: General
          optional: true
      - extendedWaitUntil:
          visible: Ask anything.*
          timeout: 10000
- tapOn: Ask anything.*
- inputText: Plan the replies
- tapOn:
    text: Send
    optional: true
- extendedWaitUntil:
    visible: Want a notification.*
    timeout: 20000
    optional: true
- tapOn:
    text: Not now
    optional: true
# 1. The turn ends with two steps open: the closing line is in and the composer is idle again,
#    and the strip is still pinned above it, reading "1 of 3" and the step in progress.
- extendedWaitUntil:
    visible: Two steps are still open.*
    timeout: 60000
- extendedWaitUntil:
    visible: Camera
    timeout: 15000
- assertNotVisible: Stop response
- extendedWaitUntil:
    visible: Plan, 1 of 3, Draft the replies
    timeout: 10000
- takeScreenshot: 11-plan-pinned-after-turn
# 2. It still expands and collapses.
- tapOn: Plan, 1 of 3, Draft the replies
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 11-plan-expanded-after-turn
- tapOn: Plan, 1 of 3, Draft the replies
- waitForAnimationToEnd:
    timeout: 3000
# 3. The next turn finishes every step: the strip goes and the Plan row settles in the transcript.
- tapOn: Ask anything.*
- inputText: Finish the plan
- tapOn:
    text: Send
    optional: true
- extendedWaitUntil:
    visible: Every step is done.*
    timeout: 60000
- extendedWaitUntil:
    notVisible: Plan, 1 of 3, Draft the replies
    timeout: 10000
- extendedWaitUntil:
    visible: Camera
    timeout: 15000
- assertVisible: Plan, 3 of 3
- assertNotVisible:
    text: Plan, 3 of 3
    index: 1
- takeScreenshot: 11-plan-settled
