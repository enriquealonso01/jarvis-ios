appId: com.enriquecodes.jarvis
# A real turn against scripts/local-hermes's stub model: it answers "Let me run a quick
# check.", asks to approve python3 -c "print(1)", then "The command returned: 1."
name: 03 new session send approve and reply
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: Settings
    timeout: 30000
# New Session stays disabled while the list still shows cached rows after launch, so try
# again until the chat opens.
- retry:
    maxRetries: 3
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn: New Session
      # Once a project lane names a folder, New Session asks where; General is the default.
      - tapOn:
          text: General
          optional: true
      - extendedWaitUntil:
          visible: Ask anything.*
          timeout: 10000
- tapOn: Ask anything.*
- inputText: Automated QA ping
- tapOn:
    text: Send
    optional: true
# Hermex's one-time offer after the first run started from the phone (#863) is an alert
# that hides the transcript from Maestro until it is answered.
- extendedWaitUntil:
    visible: Want a notification.*
    timeout: 20000
    optional: true
- takeScreenshot: 03-notification-offer
- tapOn:
    text: Not now
    optional: true
- extendedWaitUntil:
    visible: Automated QA ping
    timeout: 15000
- takeScreenshot: 03-sent
- extendedWaitUntil:
    visible: Let me run a quick check.*
    timeout: 60000
    optional: true
- takeScreenshot: 03-approval
# iOS's one-time "slide to type" keyboard tip is a system sheet that swallows taps on the
# approval card (run 39626602327); the workflow also marks it seen before launch.
- tapOn:
    text: Continue
    optional: true
# The approval card can land a few seconds after the interim reply (run 39783614012 tapped
# before it was up); wait for it.
- extendedWaitUntil:
    visible: Allow once
    timeout: 60000
    optional: true
- tapOn:
    text: Allow once
    optional: true
- tapOn:
    text: Approve.*
    optional: true
- tapOn:
    text: Allow.*
    optional: true
- tapOn:
    text: Run.*
    optional: true
- extendedWaitUntil:
    visible: The command returned.*
    timeout: 60000
    optional: true
- takeScreenshot: 03-reply
- assertVisible: The command returned.*
