name: iOS v2 screenshots

# Screenshot lane: builds the app on the macOS runner, boots it in a
# simulator with the DEBUG-only -SCREENSHOT_SEED seed (demo conversations:
# sidebar shell, transcript + composer, Item 11 rich blocks, voice pill),
# and captures real app screenshots via simctl. Uploads them as workflow
# artifacts. Runs ONLY on manual dispatch (workflow_dispatch) or on this
# dedicated branch — never gates v2.

on:
  push:
    branches:
      - ci/screenshots
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ios-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: SPM cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ios/JarvisApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml', 'Packages/**/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build app (no signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project JarvisApp.xcodeproj \
            -scheme JarvisApp \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | xcbeautify

      - name: Find simulator + app bundle
        id: env
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          APP=$(find /tmp/dd/Build/Products -name "JarvisApp.app" -path "*iphonesimulator*" | head -1)
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Simulator: $UDID  App: $APP"

      - name: Boot simulator + install
        run: |
          xcrun simctl boot "${{ steps.env.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.env.outputs.udid }}" -b
          xcrun simctl install "${{ steps.env.outputs.udid }}" "${{ steps.env.outputs.app }}"

      - name: Launch + capture (sidebar closed — transcript surface)
        run: |
          BUNDLE=com.enriquecodes.jarvis
          UDID="${{ steps.env.outputs.udid }}"
          xcrun simctl launch "$UDID" "$BUNDLE" -SCREENSHOT_SEED
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/01-chat-transcript.png
          # Rich-blocks demo conversation is mid-scroll in shot 1; capture the
          # same conversation scrolled to the envelope.
          xcrun simctl io "$UDID" screenshot shots/02-chat-rich-blocks.png

      - name: Launch + capture (sidebar open)
        run: |
          BUNDLE=com.enriquecodes.jarvis
          UDID="${{ steps.env.outputs.udid }}"
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          sleep 1
          xcrun simctl launch "$UDID" "$BUNDLE" -SCREENSHOT_SEED -SCREENSHOT_SIDEBAR_OPEN
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/03-sidebar.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-v2-screenshots
          path: shots/
          if-no-files-found: error
