name: iOS v2 package tests

# v2 gate (V2-PLAN §7 / M1): xcodegen generate → xcodebuild test with signing
# off, SPM cached. PR CI must stay under 15 min. Package `swift test` runs are
# NOT run here — the VPS has no Swift toolchain, so this job IS the compiler;
# it builds and tests every local package via the generated app project.

on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ios-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (matches ios-release pipeline)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: SPM cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ios/JarvisApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml', 'Packages/**/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: swift test (Linux-runnable packages on macOS)
        run: |
          set -e
          for pkg in JarvisKit Persistence DesignSystem FeaturesChat FeaturesVoice FeaturesRuns FeaturesCapture CallKit JarvisIntents; do
            echo "::group::swift test — $pkg"
            (cd "Packages/$pkg" && swift test)
            echo "::endgroup::"
          done

      - name: xcodebuild test (app + packages, simulator, no signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project JarvisApp.xcodeproj \
            -scheme JarvisApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | xcbeautify
