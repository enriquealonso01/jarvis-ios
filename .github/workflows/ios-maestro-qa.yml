name: iOS v2 Maestro QA

# Pre-Enrique QA lane: builds the v2 app for the simulator, seeds it with the
# DEBUG-only -SCREENSHOT_SEED demo content (no real credentials anywhere),
# then drives it like a user with Maestro (qa/maestro/*.yaml) — taps, typing,
# sidebar, export, and a real send to the live backend. Uploads screenshots
# + a JUnit report. Runs ONLY on the qa/maestro branch or manual dispatch —
# never gates v2.

on:
  push:
    branches:
      - qa/maestro
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ios-maestro-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Java for Maestro
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install xcodegen + Maestro
        run: |
          brew install xcodegen
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: SPM cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ios/JarvisApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml', 'Packages/**/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build app (Debug, simulator, ad-hoc signed)
        working-directory: ios
        # Ad-hoc signing is required: unsigned simulator apps fail Keychain
        # SecItemAdd (-34018) and the seed's token never lands.
        run: |
          set -o pipefail
          xcodebuild build \
            -project JarvisApp.xcodeproj \
            -scheme JarvisApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -derivedDataPath /tmp/dd \
            CODE_SIGN_IDENTITY=- | xcbeautify

      - name: Boot simulator, install, seed
        id: env
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          APP=$(find /tmp/dd/Build/Products -name "JarvisApp.app" -path "*iphonesimulator*" | head -1)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator: $UDID  App: $APP"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          # Seed once; Keychain/UserDefaults/GRDB persist, so every Maestro
          # cold launch afterwards sees the same signed-in demo state.
          mkdir -p "$GITHUB_WORKSPACE/qa-out"
          xcrun simctl launch "$UDID" com.enriquecodes.jarvis -SCREENSHOT_SEED
          sleep 10
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/qa-out/00-seeded-launch.png" || true
          xcrun simctl terminate "$UDID" com.enriquecodes.jarvis || true
          sleep 2
          # Plain second launch (what a real user does next) BEFORE Maestro,
          # so a launch crash is attributed to the app, not the driver.
          xcrun simctl launch "$UDID" com.enriquecodes.jarvis
          sleep 10
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/qa-out/00-plain-relaunch.png" || true
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "com.enriquecodes.jarvis"; then
            echo "plain relaunch: app ALIVE after 10s"
          else
            echo "plain relaunch: app NOT RUNNING after 10s"
          fi
          xcrun simctl terminate "$UDID" com.enriquecodes.jarvis || true
          maestro --version

      - name: Idle CPU + main-thread sample on the rich Breck chat
        continue-on-error: true
        run: |
          UDID="${{ steps.env.outputs.udid }}"
          xcrun simctl launch "$UDID" com.enriquecodes.jarvis || true
          sleep 12
          PID=$(pgrep -f "JarvisApp.app/JarvisApp" | head -1)
          echo "pid=$PID"
          for i in 1 2 3; do ps -o %cpu=,rss= -p "$PID" | awk '{print "idle cpu% " $1 "  rss_kb " $2}'; sleep 2; done
          sample "$PID" 5 -file /tmp/sample.txt >/dev/null 2>&1 || true
          echo "---- main thread (top of call graph) ----"
          awk '/Thread_[0-9]+.*(main-thread|DispatchQueue_1)/{f=1} f{print} /^ *$/{if(f)exit}' /tmp/sample.txt | head -60
          cp /tmp/sample.txt "$GITHUB_WORKSPACE/qa-out/idle-sample.txt" 2>/dev/null || true
          xcrun simctl terminate "$UDID" com.enriquecodes.jarvis || true

      - name: Dump UI hierarchy (ids + labels) of the launch screen
        continue-on-error: true
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          UDID="${{ steps.env.outputs.udid }}"
          xcrun simctl launch "$UDID" com.enriquecodes.jarvis || true
          sleep 8
          maestro --device "$UDID" hierarchy > /tmp/h.json 2>/dev/null || true
          python3 - <<'PY'
          import json
          try:
              root = json.load(open("/tmp/h.json"))
          except Exception as e:
              print("no hierarchy:", e); raise SystemExit
          def walk(n, d=0):
              a = n.get("attributes", {})
              rid = a.get("resource-id") or a.get("identifier") or ""
              txt = (a.get("text") or a.get("accessibilityText") or a.get("label") or "")[:60]
              if rid or txt:
                  print("  " * min(d, 12) + f"[{rid}] '{txt}' {a.get('bounds','')} enabled={a.get('enabled','')}")
              for c in n.get("children", []): walk(c, d + 1)
          walk(root)
          PY
          cat > /tmp/type.yaml <<'YML'
          appId: com.enriquecodes.jarvis
          ---
          - tapOn:
              id: "composer.textField"
          - inputText: "hierarchy probe"
          YML
          maestro --device "$UDID" test /tmp/type.yaml || true
          maestro --device "$UDID" hierarchy > /tmp/h2.json 2>/dev/null || true
          echo "---- after typing (composer subtree) ----"
          python3 - <<'PY'
          import json
          root = json.load(open("/tmp/h2.json"))
          def walk(n):
              a = n.get("attributes", {})
              rid = a.get("resource-id") or ""
              txt = (a.get("text") or a.get("accessibilityText") or "")[:40]
              b = a.get("bounds", "")
              try: y = int(b.split("][")[0].split(",")[1])
              except Exception: y = 0
              if y > 250 and (rid or txt) and not (len(txt) == 1 and not rid): print(f"[{rid}] '{txt}' {b} enabled={a.get('enabled','')}")
              for c in n.get("children", []): walk(c)
          walk(root)
          PY
          xcrun simctl terminate "$UDID" com.enriquecodes.jarvis || true

      - name: Run Maestro journeys
        id: maestro
        continue-on-error: true
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/qa-out"
          cd "$GITHUB_WORKSPACE/qa-out"
          maestro --device "${{ steps.env.outputs.udid }}" test \
            --format junit --output "$GITHUB_WORKSPACE/qa-out/report.xml" \
            --test-output-dir "$GITHUB_WORKSPACE/qa-out/maestro" \
            "$GITHUB_WORKSPACE/qa/maestro"

      - name: Collect app log + network evidence
        if: always()
        run: |
          UDID="${{ steps.env.outputs.udid }}"
          xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'process == "JarvisApp"' > "$GITHUB_WORKSPACE/qa-out/app.log" 2>&1 || true
          cp -R ~/.maestro/tests "$GITHUB_WORKSPACE/qa-out/maestro-debug" 2>/dev/null || true
          find "$GITHUB_WORKSPACE/qa-out" -name "*.png" | sort
          echo "---- crash reports ----"
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/JarvisApp* 2>/dev/null | head -3); do
            echo "== $f"; cp "$f" "$GITHUB_WORKSPACE/qa-out/" || true
            python3 - "$f" <<'PY' || head -c 6000 "$f"
          import json, sys
          raw = open(sys.argv[1]).read()
          head, _, body = raw.partition(chr(10))
          try:
              j = json.loads(body)
          except Exception:
              print(raw[:6000]); sys.exit(0)
          print("exception:", json.dumps(j.get("exception")), "termination:", json.dumps(j.get("termination"))[:600])
          asi = j.get("asi") or {}
          if asi: print("asi:", json.dumps(asi)[:1500])
          imgs = j.get("usedImages", [])
          ft = j.get("faultingThread", 0)
          th = (j.get("threads") or [{}])[ft]
          for fr in (th.get("frames") or [])[:25]:
              img = imgs[fr.get("imageIndex", 0)] if imgs else {}
              print("  ", img.get("name", "?"), fr.get("symbol", "?"), "+", fr.get("symbolLocation", ""))
          PY
          done
          echo "---- app log (errors/faults, last 60) ----"
          grep -iE "error|fault|fatal|crash|precondition" "$GITHUB_WORKSPACE/qa-out/app.log" | tail -60 || true
          echo "---- JUnit ----"
          cat "$GITHUB_WORKSPACE/qa-out/report.xml" || true

      - name: Upload QA output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-v2-maestro-qa
          path: qa-out/
          if-no-files-found: warn

      - name: Fail if any journey failed
        if: steps.maestro.outcome == 'failure'
        run: exit 1
