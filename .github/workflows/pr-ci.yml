# Contributor CI: build and run the full XCTest suite on every pull request
# that touches app code, then check the build's extracted UI strings against
# the String Catalog (ci/check_string_catalog.py). Pushes to master run the
# full suite too: PRs need not be up to date to merge, so two green PRs can
# still break master together. PRs limited to docs
# (markdown, docs/, community files) and local tooling (scripts/) skip the
# macOS runner entirely. The tooling tests (scripts/tests, ci/) run on Linux for
# every PR and push, so a tooling-only change still gets tested.
#
# The required branch-protection check is "CI Gate", not "Build and Test":
# a skipped required check would block merges forever, so the gate always
# runs and passes when the tooling tests passed and the suite either succeeded
# or was legitimately skipped.
#
# Uses no repository secrets, so PRs from forks get green CI too.
#
# Code signing is disabled (CODE_SIGNING_ALLOWED=NO) — fine for compile/test
# runs per TESTFLIGHT.md; the "simulator installs must be signed" rule applies
# to manual simulator testing, not CI.

name: PR CI

# JARVIS v3: PRs into v3 (the v3-work draft PR) and pushes to v3 run the full
# suite on GitHub's hosted Xcode 27 image; the repo is public, so it's free.
on:
  pull_request:
    branches: [v3]
  push:
    branches: [v3]
  # Manual runs are the fast inner loop for a branch that has no PR yet (JARVIS
  # has no Xcode on its Linux host, so this is its compiler):
  #   compile  build only: about 3 minutes on the cached build, about 6 from scratch
  #   tests    build, then only the test classes named in only_testing
  #   full     the whole suite, same as a PR
  # PR and push runs are always full, and always build from scratch.
  #
  # The cached build (measured 2026-11-25, runs 45684456400 to 45686080032): a manual run
  # restores the DerivedData of a recent v3 build and gives unchanged files their old times
  # back (ci/derived_cache.py), so Xcode compiles only what the branch changed. The build step
  # took 62 s with nothing changed and 115 s after a change to a central type, against 324 s
  # from scratch. The cache is written only by the warm-up run on the default branch
  # (warm-build-cache.yml on main, which calls this workflow with save_cache), because a run
  # on any branch can read the default branch's caches and no other branch's.
  # PR and push runs never read it: the gate that guards v3 stays a clean build.
  workflow_dispatch:
    inputs:
      mode:
        description: "compile = build only; tests = build + only_testing; full = whole suite"
        type: choice
        options: [full, compile, tests]
        default: full
      only_testing:
        description: "mode=tests: test identifiers separated by spaces, e.g. HermesMobileTests/TextMessageOutboxTests"
        type: string
        default: ""
      clean:
        description: "build from scratch instead of on the cached build"
        type: boolean
        default: false
      save_cache:
        description: "build from scratch and save the result as the cache (the warm-up run does this)"
        type: boolean
        default: false
  # The warm-up run on the default branch calls this workflow, so the build it caches is made
  # by exactly these steps.
  workflow_call:
    inputs:
      mode:
        type: string
        default: compile
      only_testing:
        type: string
        default: ""
      clean:
        type: boolean
        default: false
      save_cache:
        type: boolean
        default: false
      checkout_ref:
        description: "branch to build (the caller's own ref when empty)"
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

# A newer push to a PR cancels its older run, and a newer manual run on a branch
# cancels that branch's older manual run. A master run always finishes;
# pushes that land meanwhile wait, and only the newest waiting one runs. Its
# result covers every commit before it, so a burst of merges ends with one
# result for the latest master rather than a queue of macOS runs.
concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_ios: ${{ steps.filter.outputs.run_ios }}
    steps:
      - name: Classify changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "Push or manual run — running the full suite."
            echo "run_ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          echo "Changed files:"
          echo "${files}"
          # Fail closed: anything NOT on the allowlist triggers the full suite
          # (including workflow, project, and config changes). scripts/ is
          # local tooling that no build phase or iOS step calls (the tooling
          # job only runs its tests); take it off the allowlist if that ever
          # changes.
          app_changes=$(echo "${files}" | grep -vE '^(docs/.*|scripts/.*|LICENSE|\.gitignore|\.github/ISSUE_TEMPLATE/.*|\.github/CODEOWNERS|\.github/dependabot\.yml|\.github/FUNDING\.yml|.*\.md)$' || true)
          if [[ -n "${app_changes}" ]]; then
            echo "App-affecting changes detected — running the full suite:"
            echo "${app_changes}"
            echo "run_ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs or scripts only — skipping the macOS runner."
            echo "run_ios=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Build and Test
    needs: changes
    if: needs.changes.outputs.run_ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 90

    env:
      PROJECT_PATH: HermesMobile.xcodeproj
      SCHEME: HermesMobile
      DERIVED_DATA_PATH: DerivedData
      RESULT_BUNDLE_PATH: TestResults.xcresult
      # The Xcode used locally and for release builds (DEVELOPMENT.md
      # § Xcode version); update these pins deliberately. iOS 27 is the
      # image's only runtime: CI skips iOS 26 rather than download one.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0
      SIMULATOR_NAME: iPhone 17
      CI_LOG_DIR: ci-logs
      TEST_WORKER_COUNT: 1
      # Only a manual run (or the warm-up run) can ask for less than the full suite. PR and
      # push runs carry no inputs, so they are always full.
      RUN_MODE: ${{ inputs.mode || 'full' }}
      ONLY_TESTING: ${{ inputs.only_testing || '' }}
      # Never for a PR or a push (the gate builds from scratch), and never for the run that
      # writes the cache (a cache must itself be a clean build).
      USE_BUILD_CACHE: ${{ github.event_name != 'pull_request' && github.event_name != 'push' && !inputs.clean && !inputs.save_cache }}
      SAVE_BUILD_CACHE: ${{ github.event_name != 'pull_request' && github.event_name != 'push' && inputs.save_cache == true }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || '' }}

      - name: Verify Xcode
        id: toolchain
        run: |
          set -euo pipefail
          mkdir -p "${CI_LOG_DIR}"
          {
            if [[ ! -d "${DEVELOPER_DIR}" ]]; then
              echo "Pinned Xcode is missing: ${DEVELOPER_DIR}" >&2
              exit 1
            fi
            xcodebuild -version
            xcrun --find simctl
          } 2>&1 | tee "${CI_LOG_DIR}/toolchain.log"
          # A cached build is only good for the runner image and Xcode that made it.
          xcode=$(xcodebuild -version | tr -s ' \n' '--' | sed 's/-*$//')
          {
            echo "cache_prefix=derived-v1-${ImageOS:-macos}-${ImageVersion:-0}-${xcode}"
            echo "head_sha=$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "${CI_LOG_DIR}/devices.json"
          python3 - <<'PYTHON' 2>&1 | tee "${CI_LOG_DIR}/selection.log"
          import json, os
          from pathlib import Path

          devices = json.loads(Path(os.environ["CI_LOG_DIR"], "devices.json").read_text())["devices"]
          runtime = os.environ["SIMULATOR_RUNTIME"]
          name = os.environ["SIMULATOR_NAME"]
          matches = [d for d in devices.get(runtime, []) if d.get("isAvailable") and d["name"] == name]
          if len(matches) != 1:
              raise SystemExit(f"Expected one available {name} on {runtime}, found {len(matches)}. See devices.json; no fallback runtime is used.")
          udid = matches[0]["udid"]
          print(f"Using {name} on {runtime}: {udid}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"udid={udid}\n")
          PYTHON

      # Manual runs only (see the note at the top). The newest cache for this image and Xcode
      # is taken; one made for exactly this commit wins if it exists. No cache is not an
      # error: the build is then a clean one, as before.
      - name: Restore the cached build
        id: buildcache
        if: ${{ env.USE_BUILD_CACHE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DERIVED_DATA_PATH }}
          key: ${{ steps.toolchain.outputs.cache_prefix }}-${{ steps.toolchain.outputs.head_sha }}
          restore-keys: |
            ${{ steps.toolchain.outputs.cache_prefix }}-

      - name: Restore file times
        if: ${{ env.USE_BUILD_CACHE == 'true' }}
        run: |
          set -euo pipefail
          # Xcode reads file times to decide what to rebuild; a fresh checkout made them all new.
          python3 ci/derived_cache.py restore "${DERIVED_DATA_PATH}" | tee "${CI_LOG_DIR}/cache.log"
          echo "- Cached build: $(cat "${CI_LOG_DIR}/cache.log")" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build for testing
        id: build
        env:
          SIMULATOR_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          report_duration() {
            echo "- Build for testing: $((SECONDS - start_seconds))s" >> "${GITHUB_STEP_SUMMARY}"
          }
          trap report_duration EXIT
          # No index store: CI never reads it, and it would only add to the cached build's size
          # (measured: no difference in build time). The setting is the same for every run,
          # cached or not, because a cache built with other settings would not be reused.
          xcodebuild build-for-testing \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "${CI_LOG_DIR}/build.log"

      # The warm-up run only: this clean build becomes the cache manual runs start from.
      - name: Record file times for the cache
        if: ${{ env.SAVE_BUILD_CACHE == 'true' && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          rm -rf "${DERIVED_DATA_PATH}/Logs"
          python3 ci/derived_cache.py record "${DERIVED_DATA_PATH}"
          du -sh "${DERIVED_DATA_PATH}"

      - name: Save the build as the cache
        if: ${{ env.SAVE_BUILD_CACHE == 'true' && steps.build.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DERIVED_DATA_PATH }}
          key: ${{ steps.toolchain.outputs.cache_prefix }}-${{ steps.toolchain.outputs.head_sha }}

      - name: Test without building
        id: tests
        if: ${{ env.RUN_MODE != 'compile' }}
        # Bound worker clone/boot and suite execution, leaving time for diagnostics.
        timeout-minutes: 30
        env:
          SIMULATOR_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          report_duration() {
            echo "- Tests (one worker, mode ${RUN_MODE}): $((SECONDS - start_seconds))s" >> "${GITHUB_STEP_SUMMARY}"
          }
          trap report_duration EXIT
          # mode=tests narrows the run to the named classes or methods. The names
          # come from a manual input, so they are checked before reaching xcodebuild.
          only_args=()
          if [[ "${RUN_MODE}" == "tests" ]]; then
            read -r -a wanted <<< "${ONLY_TESTING}"
            if [[ ${#wanted[@]} -eq 0 ]]; then
              echo "mode=tests needs only_testing, e.g. HermesMobileTests/TextMessageOutboxTests" >&2
              exit 1
            fi
            for identifier in "${wanted[@]}"; do
              if [[ ! "${identifier}" =~ ^[A-Za-z0-9_]+(/[A-Za-z0-9_]+){0,2}$ ]]; then
                echo "Not a test identifier: ${identifier}" >&2
                exit 1
              fi
              only_args+=("-only-testing:${identifier}")
            done
            echo "Running only: ${wanted[*]}"
          fi
          # ${arr[@]+...} keeps an empty array legal under set -u on macOS bash 3.2.
          xcodebuild test-without-building \
            ${only_args[@]+"${only_args[@]}"} \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "${RESULT_BUNDLE_PATH}" \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count "${TEST_WORKER_COUNT}" \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "${CI_LOG_DIR}/tests.log"

      - name: Check String Catalog coverage
        # Reads the .stringsdata the build step already wrote; no extra build.
        # Runs after failed tests too, so a flake can't hide a missing key,
        # but only when the build succeeded and its output exists.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 ci/check_string_catalog.py --derived-data "${DERIVED_DATA_PATH}"

      - name: Report results
        if: always()
        continue-on-error: true
        env:
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          SELECTION_OUTCOME: ${{ steps.sim.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: python3 ci/report_test_results.py

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            ${{ env.RESULT_BUNDLE_PATH }}
            ${{ env.CI_LOG_DIR }}
          if-no-files-found: ignore

  tooling:
    name: Tooling Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Run tooling tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest discover -s ci -p 'test_*.py'

  gate:
    name: CI Gate
    needs: [changes, test, tooling]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          set -euo pipefail
          echo "changes: ${{ needs.changes.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "tooling: ${{ needs.tooling.result }}"
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Path detection failed — failing the gate." >&2
            exit 1
          fi
          if [[ "${{ needs.tooling.result }}" != "success" ]]; then
            echo "Tooling tests did not pass — failing the gate." >&2
            exit 1
          fi
          case "${{ needs.test.result }}" in
            success|skipped) echo "Gate passed." ;;
            *) echo "Build and Test did not pass — failing the gate." >&2; exit 1 ;;
          esac
